<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Tierra Grata</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tierra Grata">
<meta name="theme-color" content="#0b0d12">
<style>
  html, body { margin:0; padding:0; height:100%; background:#0b0d12; overflow:hidden; }
  iframe { position:fixed; inset:0; width:100%; height:100%; border:none; background:#0b0d12; }

  #splash {
    position:fixed; inset:0; z-index:9999;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:#0b0d12;
    transition:opacity .45s ease;
  }
  #splash.oculto { opacity:0; pointer-events:none; }
  #splash img { width:132px; height:132px; border-radius:28px; box-shadow:0 12px 40px rgba(255,140,43,.25); }
  #splash .nombre {
    margin-top:18px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:26px; font-weight:700; letter-spacing:2px; color:#eceef3;
  }
  #splash .puntos { margin-top:10px; color:#8b90a1; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; font-size:13px; }
</style>
</head>
<body>

<div id="splash">
  <img src="icon-512.png" alt="Tierra Grata">
  <div class="puntos">Cargando…</div>
</div>

<iframe id="app" allow="fullscreen; autoplay"></iframe>

<script>
  // Tierra Grata ahora corre en Engrane. Token: tierragrata2026
  var URL_APP = "https://app.engraneapp.com/?kc=tierragrata2026";
  var frame = document.getElementById("app");
  // Enlaces de invitado ANTIGUOS (?t=14 hex) ya no existen; los nuevos se generan en la app y abren invitado.html.
  frame.src = URL_APP;
  var splash = document.getElementById("splash");
  var oculto = false;
  function ocultarSplash() {
    if (oculto) return;
    oculto = true;
    setTimeout(function () {
      splash.classList.add("oculto");
      setTimeout(function () { splash.remove(); }, 500);
    }, 400);
  }
  frame.addEventListener("load", ocultarSplash);
  setTimeout(ocultarSplash, 4000);

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(function () {});
  }
</script>

</body>
</html>
